name: Global Culinary Hub CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Flutter Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create .env file
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          GROK_API_KEY=${{ secrets.GROK_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Tests
        run: flutter test

      - name: Fix All Android Config Files
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

          chmod +x android/gradlew

      - name: Create Android Resources
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Black.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          sudo apt-get install -y imagemagick 2>/dev/null || true

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $density in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p android/app/src/main/res/mipmap-$density
            convert -size ${size}x${size} xc:"#FF6B35" \
              -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),2" \
              android/app/src/main/res/mipmap-$density/ic_launcher.png 2>/dev/null || \
            convert -size ${size}x${size} xc:"#FF6B35" \
              android/app/src/main/res/mipmap-$density/ic_launcher.png 2>/dev/null || \
            python3 << PYEOF
          import struct, zlib
          size = $size
          def make_png(w, h, color):
              def chunk(t, d):
                  import struct, zlib
                  c = t + d
                  return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              row = b'\x00' + bytes(color) * w
              raw = row * h
              idat = chunk(b'IDAT', zlib.compress(raw, 9))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          data = make_png(size, size, [255, 107, 53])
          with open('android/app/src/main/res/mipmap-$density/ic_launcher.png', 'wb') as f:
              f.write(data)
          PYEOF
          done

          echo "Verifying icons:"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            echo -n "mipmap-$density/ic_launcher.png: "
            file android/app/src/main/res/mipmap-$density/ic_launcher.png
          done

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Release APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dandroid.useAndroidX=true -Dandroid.enableJetifier=true"
          flutter build apk --release --no-tree-shake-icons

      - name: Build Release AAB
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-culinary-hub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-culinary-hub-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
